syntax = "proto3";
package emerald.sierra.message;
option java_package = "io.emeraldpay.sierra.proto.message";

import "google/api/field_info.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/field_mask.proto";

message Project {
  string org_id = 1;
  string project_id = 2;
  string name = 3;
  string description = 4;
  // milliseconds since epoch
  uint64 created_at = 5;
}

message Org {
  string org_id = 1;
  string name = 3;
  string description = 4;
  // milliseconds since epoch
  uint64 created_at = 5;
}

message CreateProjectRequest {
  string org_id = 1;
  string name = 2;
  string description = 3;
}

message CreateProjectResponse {
  string project_id = 1;
}

message ListProjectsRequest {
  string org_id = 1;
  // project filter, empty means all projects
  repeated string project_ids = 2;
}

message GetOrgRequest {
  string org_id = 1;
}

enum Granularity {
  GRANULARITY_UNSPECIFIED = 0;
  GRANULARITY_SECOND = 1;
  GRANULARITY_MINUTE = 2;
  GRANULARITY_HOUR = 3;
  GRANULARITY_DAY = 4;
  GRANULARITY_WEEK = 5;
  GRANULARITY_MONTH = 6;
  GRANULARITY_5_MINUTES = 7;
  GRANULARITY_15_MINUTES = 8;
}

enum GroupBy {
  GROUP_BY_UNSPECIFIED = 0;
  GROUP_BY_SERVICE = 1;
  GROUP_BY_PROJECT = 2;
}

message GetRequestCountRequest {
  string org_id = 1;
  // milliseconds since epoch, inclusive
  uint64 timestamp_from = 2;
  // milliseconds since epoch, inclusive
  uint64 timestamp_to = 3;
  // service filter, empty means all services
  repeated string services = 4;
  // project filter, empty means all projects
  repeated string project_ids = 5;
  Granularity granularity = 6;
  GroupBy group_by = 7;
}

message RequestCount {
  // milliseconds since epoch, beginning of the period depending on precision
  uint64 timestamp = 1;
  // request count for the period
  uint64 count = 2;
}

message GroupRequestCount {
  // group value, either project_id or service depending on group_by in the request
  oneof group {
    string project_id = 1;
    string service = 2;
  }
  // request counts for the requested period, split according to precision, including zero values
  repeated RequestCount counts = 3;
}

message GetTokenStatRequest {
  string org_id = 1;
  // token filter, empty means all tokens
  repeated string token_ids = 2;
}

message TokenStat {
  string token_id = 1;
  // milliseconds since epoch UTC
  uint64 last_timestamp = 2;
}

// ---- Limits ----
//
// What refused a call before it was served, and the limits that were crossed. Four limits exist:
// the project's balance and its daily budget, which are money, and the rate and cost of one
// address on a public token, which are abuse protection. Billing answers what they are set to;
// this answers when they were hit and what it cost the caller.

// Why a call was refused
enum DenialReason {
  DENIAL_REASON_UNSPECIFIED = 0;
  // the project's balance was exhausted: the call was not paid for
  DENIAL_REASON_UNPAID = 1;
  // the project's daily budget was reached
  DENIAL_REASON_BUDGET = 2;
  // too many calls from one address on a public token
  DENIAL_REASON_RATE_LIMIT = 3;
  // too much cost from one address on a public token
  DENIAL_REASON_COST_LIMIT = 4;
  // the token's own restrictions: an origin or an address it is not allowed from
  DENIAL_REASON_RESTRICTED = 5;
}

// The calls refused, counted the way GetRequestCountRequest counts the served ones
message GetDeniedCountRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // milliseconds since epoch, inclusive
  uint64 timestamp_from = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch, inclusive
  uint64 timestamp_to = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
  // service filter, empty means all services
  repeated string services = 4 [
    (google.api.field_behavior) = OPTIONAL
  ];
  string project_id = 5 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // reason filter, empty means every reason
  repeated DenialReason reasons = 6 [
    (google.api.field_behavior) = OPTIONAL
  ];
  Granularity granularity = 7 [
    (google.api.field_behavior) = REQUIRED
  ];
  // one series per service and reason, instead of one per reason
  bool by_service = 8 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

// One series per reason, and per service when asked
message GroupDeniedCount {
  // set when by_service is requested
  string service = 2;
  DenialReason reason = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
  // refused calls for the requested period, split according to granularity, including zero values
  repeated RequestCount counts = 4;
}

enum LimitKind {
  LIMIT_KIND_UNSPECIFIED = 0;
  // the project's balance, with its overdraft, was spent
  LIMIT_KIND_BALANCE = 1;
  // the project's daily budget was reached
  LIMIT_KIND_BUDGET = 2;
  // the calls from one address on a public token, over ten minutes
  LIMIT_KIND_RATE = 3;
  // the cost from one address on a public token, over an hour
  LIMIT_KIND_COST = 4;
}

// How often each limit was hit, and for how long it kept calls out. Counts only: a limit on a
// public token is crossed per address, and the addresses are many and not the caller's to see
message GetLimitStatRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string project_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // Token filter. Empty means every token of the project
  optional string token_id = 3 [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // kind filter, empty means every kind
  repeated LimitKind kinds = 4 [
    (google.api.field_behavior) = OPTIONAL
  ];
  // milliseconds since epoch, inclusive
  uint64 timestamp_from = 5 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch, exclusive. Zero means now
  uint64 timestamp_to = 6 [
    (google.api.field_behavior) = OPTIONAL
  ];
  Granularity granularity = 7 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// One series per kind
message LimitStat {
  LimitKind kind = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // one per period of the requested granularity, in order, zero values included
  repeated LimitCount counts = 2;
}

message LimitCount {
  // milliseconds since epoch, beginning of the period
  uint64 timestamp = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // how many times the limit was crossed in the period. For RATE and COST, each address
  // that crossed it counts once
  uint64 crossed = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds of the period during which calls were refused for it. For RATE and COST
  // the longest block of any one address, so it never exceeds the period
  uint64 blocked_ms = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// Get a sample of the current requests
message GetLogsRequest {
  // Organization filter
  string org_id = 1
  [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // Project filter. Empty means all the projects in the organization.
  optional string project_id = 2
  [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Token filter optional. Empty means all tokens in the organization.
  // When set the project_id is required.
  optional string token_id = 3
  [
    (google.api.field_behavior) = OPTIONAL,
    (google.api.field_info).format = UUID4
  ];
  // Service filter, empty means all services (after applying the previous filters).
  // Example: `emerald.blockchain/NativeCall` or `emerald.blockchain` for all services in the `emerald.blockchain` namespace.
  optional string service = 4
  [
    (google.api.field_behavior) = OPTIONAL
  ];
}

// A partial log response, sent as soon an an event happened on the server.
// Typically it consists of at least 3 parts: start -> message* -> close, but it can be less as some of the parts can be dropped for a larger request volume.
message LogResponse {
  // Request id, same for all parts of the same request
  string request_id = 1
  [
    (google.api.field_behavior) = REQUIRED
  ];
  // Milliseconds since epoch UTC. The tiume when the event happened on the server
  uint64 timestamp = 2
  [
    (google.api.field_behavior) = REQUIRED
  ];
  // The actual log part, can be start, message or close
  LogResponsePart part = 3;
}

message LogResponsePart {

  oneof kind {
    // Sent at the beginning of the request, contains the basic info about the request
    Start start = 1;
    // Sent when a response send from the server.
    Message message = 2;
    // Sent when the request is finished
    Close close = 3;
  }

  message Start {
    // org_id in the request
    string org_id = 1 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.field_info).format = UUID4
    ];
    // project_id in the request
    string project_id = 2 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.field_info).format = UUID4
    ];
    // token_id in the request
    string token_id = 3 [
      (google.api.field_behavior) = REQUIRED,
      (google.api.field_info).format = UUID4
    ];
    // Full service name, ex. "emerald.blockchain/NativeCall"
    string service = 4 [
      (google.api.field_behavior) = REQUIRED
    ];
  }

  message Message {
    Status status = 1 [
      (google.api.field_behavior) = REQUIRED
    ];
    // Human-readable error description, set only when status is an error.
    // Empty for OK.
    optional string error_message = 2;
    // Size of the response in bytes.
    uint64 response_size = 3 [
      (google.api.field_behavior) = REQUIRED
    ];
  }

  enum Status {
    STATUS_OK = 0;
    STATUS_DENIED = 1;
    STATUS_ERROR = 2;
  }

  message Close {
    // Total time of the request in milliseconds, from the start to the end of the request
    uint64 total_time = 1 [
      (google.api.field_behavior) = REQUIRED
    ];
    // Total number of messages sent from the server for this request, without the start and close messages.
    // May be zero if the request was dropped before processing or if there were no messages to send.
    // For a simple request it's typically 1, for a streaming request it can be more than 1.
    uint64 message_count = 2 [
      (google.api.field_behavior) = REQUIRED
    ];
    // The total size of the request in bytes.
    uint64 request_size = 3 [
      (google.api.field_behavior) = REQUIRED
    ];
  }
}

//
// ============ Billing ============
//

// A sum of money
message Money {
  // Amounts are doubles: this is for display, and the accounting keeps the exact figures.
  // Negative is what the project owes or was charged
  double amount = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // ISO 4217, ex. "USD"
  string currency = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// ---- Costs ----

// How a cost series is split, under the project it always belongs to
enum CostBreakdown {
  // one series per project
  COST_BREAKDOWN_UNSPECIFIED = 0;
  // one series per project and method
  COST_BREAKDOWN_METHOD = 1;
  // one series per project, method and measurement: the grain a price is set at
  COST_BREAKDOWN_COMPONENT = 2;
}

message GetCostsRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string project_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // milliseconds since epoch, inclusive. Rounded down to the hour
  uint64 timestamp_from = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch, exclusive. Rounded up to the hour. Zero means now
  uint64 timestamp_to = 4 [
    (google.api.field_behavior) = OPTIONAL
  ];
  // HOUR, DAY, or MONTH. Anything finer is INVALID_ARGUMENT, since the hour is the grain
  // a charge exists at
  Granularity granularity = 5 [
    (google.api.field_behavior) = REQUIRED
  ];
  CostBreakdown breakdown = 6 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

// One series of costs of the project, split further when a breakdown is asked for
message CostSeries {
  string project_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // the currency of every `amount` in the series: the project's
  string currency = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  // set when breakdown is METHOD or COMPONENT
  string method = 3;
  // set when breakdown is COMPONENT, ex. `response`, `usage:rates`
  string measurement = 4;
  // one per period of the requested granularity, in order, zero values included
  repeated Cost costs = 5;
}

message Cost {
  // milliseconds since epoch, beginning of the period
  uint64 timestamp = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // The priced quantity. Only for a COMPONENT series
  double quantity = 2;
  // What the project is charged for the period, in the currency of the series: the list price
  // at the organization's rate and the currency's exchange rate. For a settled hour these are
  // the rates it was settled at; for an hour not settled yet, the rates in effect now
  double amount = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
}

message GetBillingStateRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string project_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// How far behind the usage each figure is
message BillingState {
  // milliseconds since epoch. The end of the newest hour GetCosts has a cost for; the usage
  // after it is in GetLiveCosts only
  uint64 rated_through = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch. The end of the newest hour charged into the balances, the
  // `settled_through` every Balance carries
  uint64 settled_through = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch. The latest moment GetLiveCosts covers: how far the realtime
  // metering is behind now
  uint64 live_through = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// ---- Balances ----

message GetBalanceRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string project_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

message Balance {
  string project_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // The sum of the ledger: what was paid minus what was charged, in the project's currency.
  // Negative means the project owes.
  //
  // It's the current settled amount, but the number recalculates with new usage data comes in and
  // may be amended later even for the same settled_through moment. In rare cases it may take up to 72 hours until
  // a late data comes into balance calculations.
  Money settled = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  uint64 updated_at = 3;
  // milliseconds since epoch. The hour up to which every hour of usage is charged into
  // `settled`; the usage after it is not.
  uint64 settled_through = 4 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// ---- History ----

message GetAccountHistoryRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string project_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // milliseconds since epoch, inclusive. Rounded down to the UTC day
  uint64 timestamp_from = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch, exclusive. Rounded up to the UTC day. Zero means now
  uint64 timestamp_to = 4 [
    (google.api.field_behavior) = OPTIONAL
  ];
}

// One day of a project's account: what it was charged, what it paid, and where it stood at the
// end of the day. By the day the money moved, so a correction of an earlier hour counts on the
// day it was posted. Days nothing happened on are included, with zeros and the payments empty
message AccountHistoryDay {
  // milliseconds since epoch, start of the UTC day
  uint64 timestamp = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // usage charged that day, corrections of earlier hours included,
  Money charged = 2 [
    (google.api.field_behavior) = REQUIRED
  ];
  // money moved by an operator that day, either sign
  Money adjusted = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
  // payments credited that day, zero or positive
  Money paid = 4 [
    (google.api.field_behavior) = REQUIRED
  ];
  // the balance at the end of the day, in the project's currency
  Money balance = 5 [
    (google.api.field_behavior) = REQUIRED
  ];
}

// ---- Terms ----

message GetOrgBillingRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

// The terms of an organization: what is agreed with the customer applies to every project of it
message OrgBilling {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // The discount in effect now. Absent means full price
  optional Discount discount = 2;
  // NOT IMPLEMENTED. Absent until it is
  BillingDetails details = 3;
}

// The rate the organization is charged at now
message Discount {
  // the fraction of the list price paid: 0.8 is twenty percent off, 0 is free of charge
  double rate = 1 [
    (google.api.field_behavior) = REQUIRED
  ];
  // milliseconds since epoch, when the discount ends. Zero means no end
  uint64 expires_at = 2;
}

message GetProjectBillingRequest {
  string org_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string project_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
}

message ProjectBilling {
  string project_id = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  string org_id = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_info).format = UUID4
  ];
  // ISO 4217. The currency the project is charged and paid in.
  // Set when the project is created and never changed
  string currency = 3 [
    (google.api.field_behavior) = REQUIRED
  ];
  // The most the project may spend in a UTC day, in USD at list price, before it is disabled
  // until the day ends. Absent means no budget
  optional double daily_budget_usd = 4;
}

// Who is invoiced, and where the documents go
message BillingDetails {
  // the name the documents are issued to
  string legal_name = 1;
  // where the documents are sent
  string email = 2;
  PostalAddress address = 3;
  // VAT or an equivalent, as the tax authority spells it
  string tax_id = 4;
}

message PostalAddress {
  repeated string lines = 1;
  string city = 2;
  string region = 3;
  string postal_code = 4;
  // ISO 3166-1 alpha-2
  string country = 5;
}
