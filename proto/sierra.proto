syntax = "proto3";
package emerald.sierra;
option java_package = "io.emeraldpay.sierra.proto";

import "sierra.message.proto";

service Project {
  rpc CreateProject(message.CreateProjectRequest) returns (message.Project) {}
  rpc ListProjects(message.ListProjectsRequest) returns (stream message.Project) {}
}

service Org {
  rpc GetOrg(message.GetOrgRequest) returns (message.Org) {}
}

service Stat {
  rpc GetRequestCount(message.GetRequestCountRequest) returns (stream message.GroupRequestCount) {}
  rpc GetTokenStat(message.GetTokenStatRequest) returns (stream message.TokenStat) {}

  // Subscribe to a sample of the current requests to the API.
  // "Sample" means the response is rate limited.
  // The sample usually contains all the messages before reaching "100 req/min" for the provided filter, but then drops the rest.
  // May provide less that 100 req/min if the server is under heavy load.
  // The sample is not guaranteed to be complete, but it should be representative of the current traffic for debugging.
  rpc SubscribeLogs(message.GetLogsRequest) returns (stream message.LogResponse) {}
}
