syntax = "proto3";
package emerald.sierra;
option java_package = "io.emeraldpay.sierra.proto";

import "sierra.message.proto";

service Project {
  rpc CreateProject(message.CreateProjectRequest) returns (message.Project) {}
  rpc ListProjects(message.ListProjectsRequest) returns (stream message.Project) {}
}

service Org {
  rpc GetOrg(message.GetOrgRequest) returns (message.Org) {}
}

service Stat {
  rpc GetRequestCount(message.GetRequestCountRequest) returns (stream message.GroupRequestCount) {}
  rpc GetTokenStat(message.GetTokenStatRequest) returns (stream message.TokenStat) {}

  // Subscribe to a sample of the current requests to the API.
  // "Sample" means the response is rate limited.
  // The sample usually contains all the messages before reaching "100 req/min" for the provided filter, but then drops the rest.
  // May provide less that 100 req/min if the server is under heavy load.
  // The sample is not guaranteed to be complete, but it should be representative of the current traffic for debugging.
  rpc SubscribeLogs(message.GetLogsRequest) returns (stream message.LogResponse) {}
}

// What a customer sees of the accounting. See the Billing section of sierra.message.proto for
// what the figures mean and the errors shared by every call.
service Billing {

  // What the project costs over time, split by method or component when asked.
  // Follows the latest rating of each hour, so a recent cost may change until its hour settles
  rpc GetCosts(message.GetCostsRequest) returns (stream message.CostSeries) {}

  // What a project holds: the sum of its ledger, and the rated usage not charged into it yet
  rpc GetBalance(message.GetBalanceRequest) returns (message.Balance) {}

  // A project's account day by day: charged, paid, the payments attempted, and the balance
  // at the end of each day
  rpc GetAccountHistory(message.GetAccountHistoryRequest) returns (stream message.AccountHistoryDay) {}

  // The terms: the organization's current discount and billing details, and the project's currency
  rpc GetOrgBilling(message.GetOrgBillingRequest) returns (message.OrgBilling) {}
  rpc GetProjectBilling(message.GetProjectBillingRequest) returns (message.ProjectBilling) {}
}
